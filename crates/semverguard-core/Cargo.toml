[package]
name = "semverguard-core"
version = "0.1.0"
description = "Embeddable core library for semverguard - pipeline, receipt, comment, SARIF, and exit code logic."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/semverguard-core"
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[features]
default = ["default-adapters"]
default-adapters = [
    "dep:semverguard-workspace",
    "dep:semverguard-git",
    "dep:semverguard-engine",
]

[dependencies]
semverguard-types = { version = "0.1.0", path = "../semverguard-types" }
semverguard-domain = { version = "0.1.0", path = "../semverguard-domain" }
semverguard-workspace = { version = "0.1.0", path = "../semverguard-workspace", optional = true }
semverguard-git = { version = "0.1.0", path = "../semverguard-git", optional = true }
semverguard-engine = { version = "0.1.0", path = "../semverguard-engine", optional = true }
anyhow = "1.0.101"
hex = "0.4.3"
semver = "1.0.27"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
time = { version = "0.3.47", features = ["formatting", "parsing"] }
toml = "0.9.8"

[dev-dependencies]
jsonschema = "0.41.0"
regex-lite = "0.1.9"
