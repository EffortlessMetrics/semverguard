[package]
name = "semverguard-cli"
version = "0.1.0"
description = "CLI for semverguard."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "semverguard"
path = "src/main.rs"

[dependencies]
semverguard-types = { path = "../semverguard-types" }
semverguard-domain = { path = "../semverguard-domain" }
semverguard-workspace = { path = "../semverguard-workspace" }
semverguard-git = { path = "../semverguard-git" }
semverguard-engine = { path = "../semverguard-engine" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
