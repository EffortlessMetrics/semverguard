[package]
name = "semverguard-cli"
version = "0.1.0"
description = "CLI for semverguard - orchestrates cargo-semver-checks across workspaces with filtering, scoping, and machine-readable reports."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[[bin]]
name = "semverguard"
path = "src/main.rs"

[dependencies]
semverguard-core = { version = "0.1.0", path = "../semverguard-core" }
semverguard-types = { version = "0.1.0", path = "../semverguard-types" }
semverguard-domain = { version = "0.1.0", path = "../semverguard-domain" }
semverguard-workspace = { version = "0.1.0", path = "../semverguard-workspace" }
semverguard-git = { version = "0.1.0", path = "../semverguard-git" }
semverguard-engine = { version = "0.1.0", path = "../semverguard-engine" }

anyhow = "1.0.101"
clap = { version = "4.5.57", features = ["derive"] }
globset = "0.4.18"
serde_json = "1.0.149"
indicatif = "0.18.3"
termcolor = "1.4.1"
time = { version = "0.3.47", features = ["formatting", "parsing"] }
toml = "0.9.8"

[dev-dependencies]
assert_cmd = "2.1.2"
jsonschema = "0.41.0"
predicates = "3.1.3"
proptest = "1.8.0"
tempfile = "3.24.0"
