[package]
name = "semverguard-cli"
version = "0.1.0"
description = "CLI for semverguard - orchestrates cargo-semver-checks across workspaces with filtering, scoping, and machine-readable reports."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[[bin]]
name = "semverguard"
path = "src/main.rs"

[dependencies]
semverguard-types = { version = "0.1.0", path = "../semverguard-types" }
semverguard-domain = { version = "0.1.0", path = "../semverguard-domain" }
semverguard-workspace = { version = "0.1.0", path = "../semverguard-workspace" }
semverguard-git = { version = "0.1.0", path = "../semverguard-git" }
semverguard-engine = { version = "0.1.0", path = "../semverguard-engine" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
termcolor = "1.4"
toml = "0.8"
time = { version = "0.3", features = ["formatting"] }
indicatif = "0.17"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
