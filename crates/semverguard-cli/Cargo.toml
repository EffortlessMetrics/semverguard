[package]
name = "semverguard-cli"
version = "0.1.0"
description = "Command-line interface for semverguard workspace checks and reporting."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/semverguard-cli"
keywords.workspace = true
categories = ["development-tools", "development-tools::cargo-plugins"]
readme = "README.md"

[[bin]]
name = "semverguard"
path = "src/main.rs"

[dependencies]
semverguard-core = { version = "0.1.0", path = "../semverguard-core" }
semverguard-types = { version = "0.1.0", path = "../semverguard-types" }

anyhow = "1.0.101"
clap = { version = "4.5.57", features = ["derive"] }
serde_json = "1.0.149"
indicatif = "0.18.3"
termcolor = "1.4.1"
time = { version = "0.3.47", features = ["formatting", "parsing"] }
toml = "0.9.8"

[dev-dependencies]
assert_cmd = "2.1.2"
jsonschema = "0.41.0"
predicates = "3.1.3"
proptest = "1.8.0"
tempfile = "3.24.0"
