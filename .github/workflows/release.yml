name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Dry run (don't publish)"
        required: false
        default: true
        type: boolean

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (glibc)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: semverguard-x86_64-unknown-linux-gnu

          # Linux x86_64 (musl - static)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: semverguard-x86_64-unknown-linux-musl

          # Linux ARM64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: semverguard-aarch64-unknown-linux-gnu
            cross: true

          # macOS x86_64 (Intel)
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: semverguard-x86_64-apple-darwin

          # macOS ARM64 (Apple Silicon)
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: semverguard-aarch64-apple-darwin

          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: semverguard-x86_64-pc-windows-msvc
            ext: .exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools (Linux musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross (for ARM64 Linux)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build (native)
        if: "!matrix.cross"
        run: cargo build --release --target ${{ matrix.target }} -p semverguard-cli

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }} -p semverguard-cli

      - name: Prepare artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/semverguard dist/
          cd dist
          tar -czvf ${{ matrix.artifact }}.tar.gz semverguard
          shasum -a 256 ${{ matrix.artifact }}.tar.gz > ${{ matrix.artifact }}.tar.gz.sha256

      - name: Prepare artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/${{ matrix.target }}/release/semverguard.exe dist/
          cd dist
          Compress-Archive -Path semverguard.exe -DestinationPath ${{ matrix.artifact }}.zip
          (Get-FileHash -Algorithm SHA256 ${{ matrix.artifact }}.zip).Hash.ToLower() + "  ${{ matrix.artifact }}.zip" | Out-File -Encoding ASCII ${{ matrix.artifact }}.zip.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && !inputs['dry-run']
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.sha256" \) -exec cp {} release/ \;
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crate:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && !inputs['dry-run']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate tag and crate versions
        shell: bash
        run: |
          set -euo pipefail

          tag_version="${GITHUB_REF_NAME#v}"
          crates=(
            semverguard-types
            semverguard-domain
            semverguard-workspace
            semverguard-git
            semverguard-engine
            semverguard-core
            semverguard-cli
          )

          expected_version=""
          for crate in "${crates[@]}"; do
            manifest="crates/${crate}/Cargo.toml"
            crate_version="$(grep -m1 '^version = "' "$manifest" | sed -E 's/version = "([^"]+)"/\1/')"

            if [[ -z "$crate_version" ]]; then
              echo "Could not parse version from ${manifest}"
              exit 1
            fi

            if [[ -z "$expected_version" ]]; then
              expected_version="$crate_version"
              continue
            fi

            if [[ "$crate_version" != "$expected_version" ]]; then
              echo "Version mismatch: ${crate}=${crate_version}, expected ${expected_version}"
              exit 1
            fi
          done

          if [[ "$tag_version" != "$expected_version" ]]; then
            echo "Tag version ${tag_version} does not match crate version ${expected_version}"
            exit 1
          fi

      - name: Publish crates
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          publish_crate() {
            local crate="$1"
            local log_file
            log_file="$(mktemp)"

            if cargo publish -p "$crate" --allow-dirty 2>&1 | tee "$log_file"; then
              rm -f "$log_file"
              return 0
            fi

            if grep -qiE "already (uploaded|exists)|has already been uploaded" "$log_file"; then
              echo "crate ${crate} already published; continuing."
              rm -f "$log_file"
              return 0
            fi

            echo "cargo publish failed for ${crate}"
            rm -f "$log_file"
            return 1
          }

          # Publish in dependency order; wait for crates.io indexing between crates.
          crates=(
            semverguard-types
            semverguard-domain
            semverguard-workspace
            semverguard-git
            semverguard-engine
            semverguard-core
            semverguard-cli
          )

          for i in "${!crates[@]}"; do
            publish_crate "${crates[$i]}"
            if (( i < ${#crates[@]} - 1 )); then
              sleep 30
            fi
          done
