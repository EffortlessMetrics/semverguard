name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --all-targets

      - name: Test
        run: cargo test --all-targets

  semver-check:
    name: SemVer Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # Required for SARIF upload
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for git baseline

      - name: Run semverguard
        uses: ./.github/actions/semverguard
        with:
          mode: pr
          baseline-rev: origin/main
          changed: "true"
          json-path: semverguard-report.json
          sarif-path: semverguard.sarif
          upload-sarif: "true"
          cargo-semver-checks-version: "0.35.0"

  contract-guard:
    name: Contract Guard
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check contract provenance
        run: |
          CHANGED=$(git diff --name-only ${{ github.event.pull_request.base.sha }}...${{ github.sha }} -- contracts/)
          if [ -z "$CHANGED" ]; then
            echo "No contracts/ files changed. Skipping."
            exit 0
          fi

          echo "Changed contracts files:"
          echo "$CHANGED"

          if ! echo "$CHANGED" | grep -q "^contracts/PROVENANCE$"; then
            echo "::error::contracts/ files were modified but contracts/PROVENANCE was not updated."
            echo "Please update contracts/PROVENANCE with the current sync metadata."
            exit 1
          fi

          # Validate required fields in PROVENANCE
          PROVENANCE="contracts/PROVENANCE"
          MISSING=""
          for field in source_repo upstream_sha synced_at; do
            if ! grep -q "^${field} = " "$PROVENANCE"; then
              MISSING="$MISSING $field"
            fi
          done

          if [ -n "$MISSING" ]; then
            echo "::error::contracts/PROVENANCE is missing required fields:$MISSING"
            exit 1
          fi

          echo "Contract provenance check passed."
