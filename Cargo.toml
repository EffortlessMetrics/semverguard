[workspace]
resolver = "2"
members = [
  "crates/semverguard-types",
  "crates/semverguard-domain",
  "crates/semverguard-workspace",
  "crates/semverguard-git",
  "crates/semverguard-engine",
  "crates/semverguard-core",
  "crates/semverguard-cli",
  "crates/semverguard-integration-tests",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/EffortlessMetrics/semverguard"
rust-version = "1.92"
homepage = "https://github.com/EffortlessMetrics/semverguard"
documentation = "https://docs.rs/semverguard-cli"
keywords = ["semver", "semantic-versioning", "cargo-semver-checks", "cargo", "ci"]
categories = ["development-tools"]
