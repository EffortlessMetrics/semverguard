[package]
name = "semverguard-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/EffortlessMetrics/semverguard"
homepage = "https://github.com/EffortlessMetrics/semverguard"
documentation = "https://docs.rs/semverguard-cli"
keywords = ["semver", "semantic-versioning", "cargo-semver-checks", "cargo", "ci"]
categories = ["development-tools", "development-tools::cargo-plugins"]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
semverguard-types = { path = "../crates/semverguard-types" }
toml = "0.9.8"
serde_json = "1.0.149"

[workspace]
members = ["."]
